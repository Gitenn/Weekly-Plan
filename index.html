<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1e7df" />
    <title>Rose &amp; Ribbon — Weekly Planner</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="page-frame" aria-hidden="true">
      <div class="botanical botanical--left">
        <img src="assets/botanical/image-from-rawpixel-id-16823162-png.png" alt="" />
      </div>
      <div class="botanical botanical--right">
        <img src="assets/botanical/image-from-rawpixel-id-16733280-png.png" alt="" />
      </div>
      <div class="botanical botanical--bottom">
        <img src="assets/botanical/image-from-rawpixel-id-16733444-png.png" alt="" />
      </div>
      <div class="botanical botanical--rose">
        <img src="assets/botanical/image-from-rawpixel-id-16745039-png.png" alt="" />
      </div>
      <div class="botanical botanical--orchid">
        <img src="assets/botanical/image-from-rawpixel-id-16816034-png(1).png" alt="" />
      </div>
      <div class="botanical botanical--bell">
        <img src="assets/botanical/image-from-rawpixel-id-16822442-png.png" alt="" />
      </div>
      <div class="botanical botanical--berry">
        <img src="assets/botanical/image-from-rawpixel-id-16823136-png.png" alt="" />
      </div>
      <div class="botanical botanical--pansy">
        <img src="assets/botanical/image-from-rawpixel-id-16823337-png.png" alt="" />
      </div>
      <div class="botanical botanical--corner botanical--corner-top-left">
        <img src="assets/botanical/image-from-rawpixel-id-16745039-png.png" alt="" />
      </div>
      <div class="botanical botanical--corner botanical--corner-top-right">
        <img src="assets/botanical/image-from-rawpixel-id-16823136-png.png" alt="" />
      </div>
      <div class="botanical botanical--corner botanical--corner-bottom-left">
        <img src="assets/botanical/image-from-rawpixel-id-16822442-png.png" alt="" />
      </div>
      <div class="botanical botanical--corner botanical--corner-bottom-right">
        <img src="assets/botanical/image-from-rawpixel-id-16745039-png.png" alt="" />
      </div>
    </div>

    <main class="planner-shell">
      <header class="masthead">
        <h1>Your weekly plan</h1>
      </header>

      <nav class="toolbar" aria-label="Weekly planner controls">
        <button type="button" class="nav-button" id="previous-week" aria-label="Previous week">‹</button>
        <div id="week-label" class="week-label" aria-live="polite" aria-atomic="true"></div>
        <button type="button" class="nav-button" id="next-week" aria-label="Next week">›</button>
        <button type="button" class="today-button" id="this-week">This week</button>
      </nav>

      <section id="week-grid" class="week-grid" aria-label="Weekly planner cards"></section>

      <footer class="footer">
        <p class="footer-quote">Elegance is mandatory, stress is optional.</p>
      </footer>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <button type="button" id="open-editor" class="edit-flower" aria-label="Edit plans" title="Edit plans">
      <img src="assets/botanical/image-from-rawpixel-id-16745039-png.png" alt="" />
    </button>

    <div id="scrim" class="scrim" aria-hidden="true" hidden></div>

    <aside id="editor" class="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden>
      <div class="editor-header">
        <div>
          <p class="eyebrow eyebrow--small">Your private concierge</p>
          <h2 id="editor-title">Plan the day</h2>
          <div class="editor-day-picker">
            <button type="button" id="previous-day" class="day-nav-button" aria-label="Previous day">‹</button>
            <div class="editor-date-display">
              <input id="editor-date" name="viewedDate" type="date" aria-label="Choose a day" />
              <p id="selected-date" class="selected-date" lang="nb-NO"></p>
            </div>
            <button type="button" id="next-day" class="day-nav-button" aria-label="Next day">›</button>
          </div>
        </div>
        <button type="button" id="close-editor" class="close-button" aria-label="Close planner editor">×</button>
      </div>

            <div class="editor-content">
        <div class="editor-tabs" role="tablist" aria-label="Planner mode">
          <button type="button" role="tab" id="tab-default" class="editor-tab" aria-selected="false" aria-controls="panel-default" tabindex="-1">Default plan</button>
          <button type="button" role="tab" id="tab-specific" class="editor-tab" aria-selected="true" aria-controls="panel-specific" tabindex="0">Specific days</button>
        </div>

        <section id="panel-default" role="tabpanel" aria-labelledby="tab-default" hidden>
          <div class="weekday-chips" role="group" aria-label="Weekday">
            <button type="button" class="chip" data-weekday="monday" aria-pressed="false">M</button>
            <button type="button" class="chip" data-weekday="tuesday" aria-pressed="false">T</button>
            <button type="button" class="chip" data-weekday="wednesday" aria-pressed="false">W</button>
            <button type="button" class="chip" data-weekday="thursday" aria-pressed="false">T</button>
            <button type="button" class="chip" data-weekday="friday" aria-pressed="false">F</button>
          </div>
          <div id="default-event-list" class="event-list"></div>
          <button type="button" id="copy-default-all" class="btn btn--secondary btn--small">Copy to all weekdays</button>
        </section>

        <section id="panel-specific" role="tabpanel" aria-labelledby="tab-specific">
          <div class="day-mode">
            <span class="day-mode-label">Use the default plan for this day</span>
            <button type="button" role="switch" id="use-default-switch" class="switch" aria-checked="true" aria-label="Use the default plan for this day"></button>
          </div>
          <p id="day-mode-message" class="field-hint" hidden></p>
          <div id="default-preview" class="event-list" hidden></div>
          <div id="specific-event-list" class="event-list"></div>
          <button type="button" id="start-from-default" class="btn btn--secondary btn--small" hidden>Start from the default</button>

          <section>
            <h3 class="section-title">Focus for the day</h3>
            <form id="plans-form">
              <div class="field field--full">
                <input id="focus-plan" name="focus" maxlength="80" placeholder="One thing to make room for" />
              </div>
              <div class="form-actions">
                <button type="button" id="save-day-plan" class="btn btn--primary">Save day plan</button>
              </div>
            </form>
          </section>
        </section>
<section>
            <h3 id="event-form-heading" class="section-title">Add an appointment</h3>
            <form id="event-form" novalidate>
              <div class="form-grid">
                <div class="field field--full">
                  <input id="event-title" name="title" maxlength="40" required placeholder="Short and sweet to fit the card" aria-describedby="event-title-hint" />
                  <div class="field-meta">
                    <span id="event-title-count" class="field-count" aria-live="polite">0/40</span>
                  </div>
                  <p id="event-title-error" class="field-error" role="alert" hidden></p>
                </div>
                <div class="field field--full" id="event-date-field">
                  <label for="event-date">Date</label>
                  <input id="event-date" name="date" type="date" required aria-describedby="event-date-error" />
                  <p id="event-date-error" class="field-error" role="alert" hidden></p>
                </div>
                <div class="field">
                  <label for="event-time">Start time</label>
                  <input id="event-time" name="time" type="time" aria-describedby="event-time-error" />
                  <p id="event-time-error" class="field-error" role="alert" hidden></p>
                  <button type="button" id="toggle-end-time" class="text-link" aria-expanded="false" aria-controls="end-time-field">Add end time</button>
                </div>
                <div class="field" id="end-time-field" hidden>
                  <label for="event-end-time">End time (optional)</label>
                  <input id="event-end-time" name="endTime" type="time" aria-describedby="event-end-time-error" />
                  <p id="event-end-time-error" class="field-error" role="alert" hidden></p>
                </div>
                <div class="field field--full">
                  <select id="event-category" name="category">
                    <option value="Appointment">Appointment</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Wellbeing">Wellbeing</option>
                    <option value="Celebration">Celebration</option>
                  </select>
                </div>
                <div class="field field--full">
                  <label for="event-note">Details (optional)</label>
                  <textarea id="event-note" name="note" maxlength="160" placeholder="A place, a reminder, or a little note…"></textarea>
                </div>
              </div>
              <button type="button" id="cancel-edit" class="btn btn--secondary" hidden>Cancel edit</button>
            </form>
          </section>

                </div>

      <div class="editor-footer">
        <button type="button" id="cancel-editor" class="btn btn--secondary">Cancel</button>
        <button type="submit" form="event-form" class="btn btn--primary" id="save-event">Save appointment</button>
      </div>
    </aside>

    <div class="language-toggle" role="group" aria-label="Date language">
      <button type="button" class="language-button" id="language-no" aria-pressed="true">NO</button>
      <button type="button" class="language-button" id="language-en" aria-pressed="false">EN</button>
    </div>

    <script>
      window.ROSE_RIBBON_DATA = {"events":[],"plans":{},"showWeekends":false,"displayWeek":null}; // ROSE_RIBBON_DATA
    </script>
    <script src="app.js"></script>
  </body>
</html>
